<section class="contact-details">
  @if (dbService.selectedContact(); as contact) {
    <section class="contact">
      <div class="logo" [style]="changeStyles()">
        <p>{{ shortname }}</p>
      </div>

      <div class="contact-name">
        @if (contact.name) {
          <h2>{{ contact.name }}</h2>
        }

        <!-- {{ dbService.id().id }} -->
        <div class="contact-btn">
          <button (click)="editContact()" class="edit-btn">
            <img src="assets/icons/edit-btn.png" alt="Edit Button" />
            <p>Edit</p>
          </button>

          <button (click)="deleteContact()" class="delete-btn">
            <img src="assets/icons/delete-btn.png" alt="Delete Button" />
            <p>Delete</p>
          </button>
        </div>
      </div>
    </section>

    <section class="contact-info">
      <h3>Contact Information</h3>

      <h4>Email</h4>
      @if (contact.email) {
        <p class="email">{{ contact.email }}</p>
      }

      <h4>Phone</h4>
      @if (contact.phone) {
        <p>{{ contact.phone }}</p>
      }
    </section>
  }
</section>
