<div class="contact-list">
  <div class="add-contact-wrapper">
    <button class="add-contact">
      <span class="add-contact-text">Add new contact</span>
      <img src="assets/icons/person_add.svg" />
    </button>
  </div>

  <div class="contact-group-wrapper">
    <div class="contact-group">
      <h3 class="contact-group-letter">A</h3>
      <ul class="contact-group-items">
        @for (contact of contacts(); track contact.id) {
          <li>
            <button class="contact-item" type="button">
              <span class="contact-avatar">AM</span>
              <span class="contact-info">
                <span class="contact-name"> {{ contact.name }} </span>
                <span class="contact-email"> {{ contact.email }} </span>
              </span>
            </button>
          </li>
        }
      </ul>
    </div>
  </div>
</div>
