<div class="contacts-list">
  <app-contact-list />
</div>
<section class="contacts-details">
  <header class="contacts-details__header">
    <h1 class="contacts-details__title">Contacts</h1>
    <p class="contacts-details__subtitle">Better with a team</p>
  </header>
  <app-contact-detail />
</section>

  <!--  TEMP: Test für Edit-Dialog, vor Merge entfernen -->
@if (isEditTestOpen() && db.contacts()[0]; as testContact) {
  <app-edit-contact [contact]="testContact" (closed)="isEditTestOpen.set(false)" />
}
