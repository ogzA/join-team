<div class="contacts-list" (click)="toggle()">
  <app-contact-list />
</div>
<section class="contacts-details">
  <header class="contacts-details__header">
    <h1 class="contacts-details__title">Contacts</h1>
    <p class="contacts-details__subtitle">Better with a team</p>
    <button
      class="contacts-details__back"
      type="button"
      aria-label="Back to contact list"
      (click)="closeDetails()"
    >
      <img src="assets/icons/arrow-left.png" alt="" />
    </button>
  </header>

  @if (isShown()) {
    <div class="contact-details-wrapper" animate.enter="enter-animation">
      <app-contact-detail />
    </div>
  }
</section>
