<section class="sidebar">
  <section class="sidebar-logo">
    <img src="assets/images/logo.svg" alt="join_logo_sideNavBar" />
  </section>

  <section class="sidebar-menus">
    @if (isLoggedIn()) {
      <div
        class="sidebar-menus-align"
        routerLink="/dashboard/summary"
        routerLinkActive="sidebar-menus-align--active"
      >
        <img src="assets/icons/sidebar-summary.svg" alt="sidebar_summary" />
        <p>Summary</p>
      </div>
      <div
        class="sidebar-menus-align"
        routerLink="/dashboard/add-task"
        routerLinkActive="sidebar-menus-align--active"
      >
        <img src="assets/icons/sidebar-add-task.svg" alt="sidebar_add_task" />
        <p>Add Task</p>
      </div>
      <a
        class="sidebar-menus-align"
        routerLink="/dashboard/board"
        routerLinkActive="sidebar-menus-align--active"
      >
        <img src="assets/icons/sidebar-board.svg" alt="sidebar_board" />
        <p>Board</p>
      </a>
      <a
        class="sidebar-menus-align"
        routerLink="/dashboard/contacts"
        routerLinkActive="sidebar-menus-align--active"
      >
        <img src="assets/icons/sidebar-contact.svg" alt="sidebar_contacts" />
        <p>Contacts</p>
      </a>
    } @else {
      @if (fromSignup) {
        <a class="sidebar-menus-align" routerLink="/signup">
          <img src="assets/icons/arrow-left-line-grey.svg" alt="" />
          <p>Sign up</p>
        </a>
      } @else {
        <a class="sidebar-menus-align" routerLink="/">
          <img src="assets/icons/login.svg" alt="" />
          <p>Log In</p>
        </a>
      }
    }
  </section>
  <section class="sidebar-info">
    <p class="privacy" routerLink="/privacy-policy" routerLinkActive="sidebar-menus-align--active">
      Privacy Policy
    </p>
    <p class="legal" routerLink="/legal-notice" routerLinkActive="sidebar-menus-align--active">
      Legal notice
    </p>
  </section>
</section>
