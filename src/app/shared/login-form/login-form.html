<section class="container">
    <form class="form-container" action="onSubmit()">
        <h1>Log in</h1>
        <span class="form-container_textBorder"></span>
        <div class="field">
            <input type="email"  id="email"
            formControlName="email"
            placeholder="Email">
        </div>
        <div class="field">
            <input type="password"  id="password"
            formControlName="password"
            placeholder="Password">
        </div>
        <div class="form-button">
            <button class="logIn" type="submit">Log in</button>
            <button class="asGuestLogIn" type="button">Guest Log in</button>
        </div>

    </form>
</section>
