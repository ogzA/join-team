<header class="dashboard-header">
  <img
    class="mobile-view-logo"
    src="assets/icons/join-mobile-header-logo.svg"
    alt="join_mobile_header_logo"
  />
  <p>Kanban Project Management Tool</p>
  <div class="dashboard-header-icons">
    @if (auth.loggedInStatus()) {
      <a class="dashboard-header-icons-help-logo" routerLink="/help-page" role="link" id="helpLogo">
        <img src="assets/icons/help_dashboard.svg" alt="help_logo" />
      </a>
      <button (click)="openMobileMenu($event)">
        @let avatar = nlService.setNameLogo(auth.loggedUserName());
        <span class="user-avatar">{{ avatar.name }}</span>
      </button>
    }
  </div>

  @if (mobile_menu()) {
    <div class="dashboard-header-mobile-menu">
      <ul>
        <li (click)="closeMenu()" routerLink="/help-page">Help</li>
        <li (click)="closeMenu()" routerLink="/legal-notice">Legal Notice</li>
        <li (click)="closeMenu()" routerLink="/privacy-policy">Privacy Policy</li>
        @if (auth.loggedInStatus()) {
          <li (click)="logout()">Log out</li>
        } @else {
          <li routerLink="/">Login</li>
        }
      </ul>
    </div>
  }
</header>
