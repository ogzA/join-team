<section class="container">
    <form class="form-container" [formGroup]="signupForm" (ngSubmit)="onSubmit()">
        <h1>Sign up</h1>
        <img src="assets/icons/arrow-left-line.svg" alt="go_to_previous_page">
        <span class="form-container_textBorder"></span>

        <div class="field">
            <div class="field_input">
            <input type="text" id="name" formControlName="name" placeholder="Name" />
            <img class="field_icon" src="assets/icons/person-signup.svg" alt="person_logo" />
            </div>
        </div>

        <div class="field">
            <div class="field_input">
            <input type="email" id="email" formControlName="email" placeholder="Email" />
            <img class="field_icon" src="assets/icons/mail-signup.svg" alt="mail_logo" />
            </div>
        </div>

        <div class="field">
            <div class="field_input">
            <input type="password" id="password" formControlName="password" placeholder="Password" />
            <img class="field_icon" src="assets/icons/visibility_off.svg" alt="visibility_logo" />
            </div>
        </div>

        <div class="field">
            <div class="field_input">
            <input type="password" id="ConfirmPassword" formControlName="ConfirmPassword" placeholder="Confirm Password" />
            <img class="field_icon" src="assets/icons/visibility_off.svg" alt="visibility_logo" />
            </div>
        </div>

        <div class="field">
            <input type="checkbox" id="privacyPolicy" formControlName="privacyPolicy"/>
            I accept the <span>Privacy policy</span>
        </div>

        <div class="form-button">
            <button class="logIn" type="submit">Sign up</button>
        </div>
    </form>
</section>
